name: Chartivio AI Agent

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install OpenAI
        run: npm install openai

      - name: Generate AI response
        id: ai
        run: |
          node -e "
          const OpenAI = require('openai');

          const client = new OpenAI({
            apiKey: process.env.OPENAI_API_KEY
          });

          const issue = \`${{ github.event.issue.body }}\`;

          async function run() {
            const res = await client.chat.completions.create({
              model: 'gpt-4o-mini',
              messages: [
                {
                  role: 'system',
                  content: 'You are an expert WordPress plugin developer. You debug Chartivio plugin issues (charts, JS, PHP, WordPress hooks).'
                },
                {
                  role: 'user',
                  content: issue
                }
              ]
            });

            console.log(res.choices[0].message.content);
          }

          run();
          " > response.txt

          echo "response<<EOF" >> $GITHUB_OUTPUT
          cat response.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post AI Comment
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.ai.outputs.response }}`;

            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `🤖 **Chartivio AI Agent Response**

            ${output}

            ---
            Generated automatically by GitHub AI Agent Workflow`
                        });